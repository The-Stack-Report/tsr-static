name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check that the data host still allows the site origin (CORS)
        working-directory: .
        run: |
          headers=$(curl -s -D - -o /dev/null -H "Origin: https://thestackreport.xyz" \
            "https://the-stack-report.ams3.digitaloceanspaces.com/datasets/tezos/chain/tezos-daily-chain-stats.csv")
          echo "$headers" | grep -i "^HTTP"
          echo "$headers" | grep -qi "access-control-allow-origin: https://thestackreport.xyz" \
            || echo "::warning::DigitalOcean Spaces no longer sends CORS headers for https://thestackreport.xyz - charts will not load."

      - run: npm ci

      # The snapshot (../snapshot and public/data) is committed, so no ETL runs in CI.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TSR_CNAME: thestackreport.xyz

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
